plugins { id 'com.android.library' version '8.13.0' }

android {
    namespace 'com.maestro.quest.browser'
    compileSdk 35
    ndkVersion '27.2.12479018'
    defaultConfig {
        minSdk 29
        targetSdk 34
        consumerProguardFiles 'consumer-rules.pro'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
}

def unityClasses = providers.environmentVariable('MAESTRO_UNITY_CLASSES_JAR').orNull
if (unityClasses == null || !file(unityClasses).isFile()) {
    throw new GradleException('Set MAESTRO_UNITY_CLASSES_JAR to the classes.jar supplied with the pinned Unity Android editor.')
}
dependencies {
    compileOnly files(unityClasses)
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.webkit:webkit:1.14.0'
}
