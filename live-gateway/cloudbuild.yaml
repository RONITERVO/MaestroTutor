steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - live-gateway/Dockerfile
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_TAG}
      - .
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:${_TAG}
substitutions:
  _REGION: europe-west1
  _REPOSITORY: gcf-artifacts
  _SERVICE: maestrotutor-live-gateway
  _TAG: manual
