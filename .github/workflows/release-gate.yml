name: Release gate

on:
  pull_request:
  push:
    branches:
      - main
      - feat/managed-backend

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
            live-gateway/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install app dependencies
        run: npm ci
      - name: Install Functions dependencies
        run: npm --prefix functions ci
      - name: Install Live gateway dependencies
        run: npm --prefix live-gateway ci

      # Exact, expiring exception for the unused root Firebase Node server path.
      # New advisories (including new findings on that package) fail this check.
      - name: Audit shipped app dependencies
        run: |
          npm audit --omit=dev --json > app-audit.json || test "$?" -eq 1
          node scripts/verify-app-audit.mjs app-audit.json
      - name: Audit shipped Functions dependencies
        run: npm --prefix functions audit --omit=dev --audit-level=high
      - name: Audit shipped Live gateway dependencies
        run: npm --prefix live-gateway audit --omit=dev --audit-level=high

      - name: Verify generated behaviour catalog sources
        run: npm run verify:behaviour-catalog
      - name: Verify included Quest avatar integrity
        run: npm run verify:quest-assets
      - name: Test Quest release manifest policy
        shell: pwsh
        run: ./unity/Tools/Test-QuestReleaseManifest.ps1
      - name: Test Unity diagnostic log gate
        shell: pwsh
        run: ./unity/Tools/Test-QuestUnityLog.ps1
      - name: Test native suite coverage gate
        shell: pwsh
        run: ./unity/Tools/Test-QuestTestCoverage.ps1
      - name: Test offline Live evidence gate
        shell: pwsh
        run: ./unity/Tools/Test-QuestLiveContinuity.ps1
      - name: Type-check native integration drivers
        run: npm run verify:quest-probes
      - name: Test app and shared core
        run: npm test
      - name: Lint app
        run: npm run lint
      - name: Build production app
        run: npm run build
      - name: Verify compiled microphone capture in headless Chrome
        timeout-minutes: 2
        run: npm run test:capture:browser
      - name: Verify first Quest lesson through the production app
        id: first-learner
        timeout-minutes: 5
        run: npm run test:quest:first-learner
      - name: Retain first-lesson browser evidence
        if: always() && steps.first-learner.outcome != '' && steps.first-learner.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: quest-first-learner
          include-hidden-files: true
          path: |
            .quest-evidence/first-learner/*.json
            .quest-evidence/first-learner/*.png
            .quest-evidence/first-learner/*.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Start the headless CLI contract
        run: |
          npm run verify:release-config
          npx tsx src/headless/cli.ts system.describe
      - name: Test Functions units and CORS
        run: npm --prefix functions test
      - name: Test Firestore billing invariants
        run: npm --prefix functions run test:emulator
      - name: Test and build Live gateway
        run: |
          npm --prefix live-gateway test
          npm --prefix live-gateway run build
