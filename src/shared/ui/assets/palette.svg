<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -5 110 110">
  <defs>
    <style>
          .brush-dip {
            transform-origin: 95px 102px;
            animation: dip 1.25s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
          }

          .paint-pulse {
            transform-origin: 65px 72px;
            animation: pulsePaint 1.25s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
          }

          .sparkle-1 {
            transform-origin: 20px 20px;
            animation: twinkle 2s ease-in-out infinite alternate;
          }

          .sparkle-2 {
            transform-origin: 85px 25px;
            animation: twinkle 2s ease-in-out infinite alternate 1s;
          }

          @keyframes dip {
            0%, 25% { transform: rotate(16deg) translate(8px, -4px); }
            75%, 100% { transform: rotate(0deg) translate(0px, 0px); }
          }

          @keyframes pulsePaint {
            0%, 35% { transform: scale(1); opacity: 0.9; }
            75%, 100% { transform: scale(1.18); opacity: 1; }
          }

          @keyframes twinkle {
            0%, 100% { transform: scale(0.6) rotate(0deg); opacity: 0.3; }
            50% { transform: scale(1.2) rotate(45deg); opacity: 1; }
          }
        </style>
  </defs>
  <path d="M 30 15            C 10 15 10 45 10 60            C 10 80 30 90 50 90            C 75 90 90 75 90 50            C 90 20 60 10 45 15            C 40 16 35 15 30 15 Z            M 30 57            C 34.4 57 38 60.6 38 65            C 38 69.4 34.4 73 30 73            C 25.6 73 22 69.4 22 65            C 22 60.6 25.6 57 30 57 Z" fill-rule="evenodd" fill="#F1F5F9" stroke="#334155" stroke-width="6"/>
  <g fill="#94A3B8">
    <circle cx="40" cy="20" r="2.5"/>
    <circle cx="48" cy="20" r="2.5"/>
    <circle cx="56" cy="20" r="2.5"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="3">
    <circle cx="28" cy="32" r="9" fill="#F43F5E"/>
    <circle cx="54" cy="30" r="10" fill="#FBBF24"/>
    <circle cx="76" cy="48" r="9" fill="#10B981"/>
    <circle cx="65" cy="72" r="10" fill="#3B82F6" class="paint-pulse"/>
  </g>
  <g class="brush-dip">
    <line x1="77" y1="84" x2="65" y2="72" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/>
    <line x1="95" y1="102" x2="77" y2="84" stroke="#B45309" stroke-width="8" stroke-linecap="round"/>
    <line x1="81" y1="88" x2="73" y2="80" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g class="sparkle-1" transform="translate(16, 16)">
    <path d="M 0 -7 Q 0 0 7 0 Q 0 0 0 7 Q 0 0 -7 0 Q 0 0 0 -7 Z" fill="#FBBF24"/>
  </g>
  <g class="sparkle-2" transform="translate(86, 26)">
    <path d="M 0 -6 Q 0 0 6 0 Q 0 0 0 6 Q 0 0 -6 0 Q 0 0 0 -6 Z" fill="#38BDF8"/>
  </g>
</svg>
