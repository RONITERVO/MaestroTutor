<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Maestro App Check smoke test</title>
  </head>
  <body>
    <main id="result">APP_CHECK_SMOKE_PENDING</main>
    <script type="module">
      import { f as firebaseService } from '/assets/googleAuthService-DfsZODdI.js';

      const result = document.querySelector('#result');
      try {
        const token = await firebaseService.getAppCheckToken(true);
        if (!token) {
          result.textContent = 'APP_CHECK_TOKEN_FAILED';
        } else {
          result.textContent = 'APP_CHECK_TOKEN_OK BACKEND_PENDING';
          try {
          const response = await fetch(
            'https://europe-west1-chatwithmaestro.cloudfunctions.net/api/auth/session',
            { headers: { 'X-Firebase-AppCheck': token } },
          );
          const payload = await response.json().catch(() => ({}));
          result.textContent = [
            'APP_CHECK_TOKEN_OK',
            `BACKEND_STATUS_${response.status}`,
            payload.error === 'Missing Authorization bearer token.'
              ? 'BACKEND_REACHED_AUTH_GATE'
              : 'BACKEND_UNEXPECTED_RESPONSE',
          ].join(' ');
          } catch (error) {
            const message = error instanceof Error ? error.message : String(error);
            result.textContent = `APP_CHECK_TOKEN_OK BACKEND_FETCH_FAILED ${message}`;
          }
        }
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        result.textContent = `APP_CHECK_SMOKE_FAILED ${message}`;
      }
    </script>
  </body>
</html>
